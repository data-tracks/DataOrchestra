[package]
name = "sensor"
version = "0.1.0"
edition = "2021"

[dependencies]
rdkafka = "0.37.0"

# Logger
log = "0.4"
env_logger = "0.11.7"
ansi_term = "0.12.1"

clap = { version = "4.5.37", features = ["derive"] }

fake = { version = "4", features = ["derive"] }

tokio = { version = "1", features = ["full"] }

reqwest = { version = "0.12", features = ["json"] }