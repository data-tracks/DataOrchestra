[package]
name = "kafka_processor"
version = "0.1.0"
edition = "2021"

[dependencies]
rdkafka = "0.37.0"
tokio = { version = "1", features = ["full"] }
futures = "0.3.0"

# Logger
log = "0.4"
env_logger = "0.11.7"
ansi_term = "0.12.1"

clap = { version = "4.5.37", features = ["derive"] }

thiserror = "2"

serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
