[package]
name = "data_orchestra"
version = "0.1.0"
edition = "2021"

[dependencies]
# Logger
log = "0.4"
env_logger = "0.11.7"

# Console argument parser
clap = { version = "4.5.37", features = ["derive"] }

# Json parser
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"

# Yaml parser
yaml-rust = "0.4"

ssh2 = "0.9.5"

ansi_term = "0.12.1"

walkdir = "2.5.0"
