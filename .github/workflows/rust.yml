name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Build main
      run: cargo build --verbose
    - name: Build kafka producer attachable
      run: |
        cd services/attachables/kafka_producer
        cargo build --verbose
    - name: Build kafka consumer attachable
      run: |
        cd services/attachables/kafka_consumer
        cargo build --verbose
    - name: Run tests
      run: cargo test --verbose
