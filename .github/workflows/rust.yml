name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      rust-version: 1.88.0
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust 1.88
        run: |
          rustup install 1.88.0
          rustup default 1.88.0
              
  build-main:
    needs: setup
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      
      - name: Set Rust 1.88
        run: rustup default 1.88.0
        
      - name: Build main
        run: cargo build --verbose
          
      - name: Run tests
        run: cargo test --verbose
      
  build-services:
    needs: setup
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
    
      - name: Set Rust 1.88
        run: rustup default 1.88.0
        
      - name: Build API
        run: |
          cd services/api
          cargo build --verbose

      - name: Build Kafka Producer attachable
        run: |
          cd services/attachables/kafka_producer
          cargo build --verbose

      - name: Build Kafka Consumer attachable
        run: |
          cd services/attachables/kafka_consumer
          cargo build --verbose
